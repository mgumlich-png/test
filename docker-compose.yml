version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gks
      POSTGRES_PASSWORD: gks
      POSTGRES_DB: gks
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-11T03-13-30Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gks
      DB_USER: gks
      DB_PASSWORD: gks
      JWT_SECRET: dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGVzdA==
    depends_on:
      - postgres
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE=/api
volumes:
  db-data:
  minio-data:
